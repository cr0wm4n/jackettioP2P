name: Publish Docker Jackettiop2p

on:
  release:
    types: [published]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Generate timestamp
      run: echo "RELEASE=${{ github.event.release.tag_name }}" >> $GITHUB_ENV

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag cr0wm4n/jackettiop2p:${{ github.event.release.tag_name }}

    - name: Push the Docker image
      run: docker push cr0wm4n/jackettiop2p:${{ github.event.release.tag_name }}
